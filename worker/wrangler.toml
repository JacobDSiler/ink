name = "ink-worker"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Reader-facing custom domain (join pages, unsubscribe + approve links, embed.js).
# wrangler creates the DNS record in the jacobsiler.com zone on deploy.
# IMPORTANT: keep this a direct child of jacobsiler.com. The zone serves its sites through a
# wildcard record, and a custom domain nested under a site hostname (e.g. go.ink.jacobsiler.com)
# turns that hostname into an "empty non-terminal" that the wildcard no longer matches —
# which took ink.jacobsiler.com offline on 2026-09-04.
# To stay on workers.dev instead: delete this block and set PUBLIC_URL below to the workers.dev URL.
routes = [
  { pattern = "go.jacobsiler.com", custom_domain = true }
]

# Runs every 5 minutes: scheduled sends, welcome sequences, nudges, 48h reports.
[triggers]
crons = ["*/5 * * * *"]

[vars]
FIREBASE_PROJECT_ID = "miscellaneous-117e9"
FIREBASE_WEB_API_KEY = "AIzaSyDxLI57pgS9WX1ekMerbcx8M6aVeWacpy0"
GEMINI_MODEL = "gemini-2.5-flash"
# Shared sending domain — verify it in Resend (see README). Authors send as penname@this-domain.
INK_FROM_DOMAIN = "mail.ink.jacobsiler.com"
# Where the app lives (links in nudge emails)
APP_URL = "https://ink.jacobsiler.com"
# This Worker's public URL (join pages, unsubscribe links, approve links). Use a custom route if you add one.
PUBLIC_URL = "https://go.jacobsiler.com"

# Secrets — set with `wrangler secret put NAME`:
#   FIREBASE_SERVICE_ACCOUNT  (the whole service-account JSON, one line)
#   RESEND_API_KEY
#   RESEND_WEBHOOK_SECRET     (whsec_… from the Resend webhook page)
#   GEMINI_API_KEY
#   INK_SIGNING_SECRET        (any long random string; signs unsubscribe/confirm/approve links)
