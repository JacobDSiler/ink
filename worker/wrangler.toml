name = "ink-worker"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Reader-facing address (join pages, unsubscribe + approve links, embed.js).
# This is a Worker ROUTE, not a custom domain: it never creates or edits DNS. It only needs
# go.jacobsiler.com to exist as a proxied (orange-cloud) record in the zone, which it does.
# History: a custom domain nested under a site hostname (go.ink.jacobsiler.com) made
# ink.jacobsiler.com an "empty non-terminal" and took the site offline on 2026-09-04, and a
# custom domain at go.jacobsiler.com then collided with the leftover record. Routes avoid both.
routes = [
  { pattern = "go.jacobsiler.com/*", zone_name = "jacobsiler.com" }
]

# Cloudflare Email Service — sends for everyone on the shared domain. Requires the Workers Paid plan and
# the sending domain onboarded under Email > Email Service in the Cloudflare dashboard (see README).
# Authors who verify their own domain in Ink are sent through Resend instead (hybrid).
[[send_email]]
name = "EMAIL"

# Runs every 5 minutes: scheduled sends, welcome sequences, nudges, 48h reports.
[triggers]
crons = ["*/5 * * * *"]

[vars]
FIREBASE_PROJECT_ID = "miscellaneous-117e9"
FIREBASE_WEB_API_KEY = "AIzaSyDxLI57pgS9WX1ekMerbcx8M6aVeWacpy0"
GEMINI_MODEL = "gemini-2.5-flash"
# Which provider sends on the shared domain: "cloudflare" (needs the send_email binding above AND the domain
# onboarded under Email > Email Service) or "resend". Ink falls back to Resend automatically for an hour if
# Cloudflare reports the domain is not onboarded, but set this to "resend" explicitly until onboarding is done.
EMAIL_PROVIDER = "resend"
# Shared sending domain for Resend sends (only used if the Cloudflare binding is absent). Authors send as penname@this-domain.
INK_FROM_DOMAIN = "mail.ink.jacobsiler.com"
# Shared sending domain for Cloudflare Email Service sends: the domain onboarded in Email Service.
# If Cloudflare only lets you onboard the zone apex, set this to "jacobsiler.com".
CF_FROM_DOMAIN = "mail.ink.jacobsiler.com"
# Region for author sending domains created through Ink (eu-west-1 | us-east-1 | sa-east-1 | ap-northeast-1)
RESEND_REGION = "eu-west-1"
# Daily sending budget for the whole instance, matching the email provider's plan.
# Resend Free = 100/day → 95. Cloudflare Email Service: new accounts start with a modest daily quota that
# grows with good sending — start around 500 and raise it as Cloudflare raises yours; 0 = unlimited.
DAILY_SEND_CAP = "500"
# Where the app lives (links in nudge emails)
APP_URL = "https://ink.jacobsiler.com"
# This Worker's public URL (join pages, unsubscribe links, approve links). Use a custom route if you add one.
PUBLIC_URL = "https://go.jacobsiler.com"

# Secrets — set with `wrangler secret put NAME`:
#   FIREBASE_SERVICE_ACCOUNT  (the whole service-account JSON, one line)
#   RESEND_API_KEY
#   RESEND_WEBHOOK_SECRET     (whsec_… from the Resend webhook page)
#   GEMINI_API_KEY
#   INK_SIGNING_SECRET        (any long random string; signs unsubscribe/confirm/approve links)
