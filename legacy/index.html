<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Ink Room — J.D. Siler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #16120e;
    --ink-mid:    #2a2218;
    --ink-soft:   #3d3428;
    --brass:      #b8860b;
    --brass-light:#d4a84b;
    --brass-pale: #f0d080;
    --parch:      #f5ead0;
    --parch-mid:  #e8d5b0;
    --parch-dark: #c8b080;
    --cavorite:   #5ba8c4;
    --cav-glow:   #7ec8e3;
    --ember:      #c84b20;
    --text:       #2a2218;
    --fade:       rgba(184,134,11,0.15);
    --border:     rgba(184,134,11,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--parch);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── BACKGROUND GLOW ── */
  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,134,11,0.06) 0%, transparent 70%);
    top: -200px; right: -200px;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-2 {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(91,168,196,0.04) 0%, transparent 70%);
    bottom: 0; left: -100px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── LOCK SCREEN ── */
  #lock-screen {
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 2rem;
    gap: 2rem;
    animation: fadeIn 0.6s ease;
  }

  .lock-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--brass-light);
    text-align: center;
    line-height: 1.3;
  }
  .lock-sub {
    font-size: 0.9rem;
    color: var(--parch-dark);
    letter-spacing: 0.08em;
    text-align: center;
  }
  .lock-input-wrap {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .lock-input {
    width: 100%;
    background: var(--ink-mid);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.9rem 1.2rem;
    color: var(--parch);
    font-family: 'Crimson Pro', serif;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .lock-input:focus { border-color: var(--brass); }
  .lock-input::placeholder { color: var(--parch-dark); opacity: 0.5; }
  .lock-error {
    color: var(--ember);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2rem;
  }

  /* ── MAIN APP ── */
  #app {
    display: none;
    position: relative;
    z-index: 1;
    max-width: 540px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
    animation: fadeIn 0.5s ease;
  }
  #app.visible { display: block; }

  /* ── HEADER ── */
  .app-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 0 1.5rem;
    gap: 0.3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.75rem;
  }
  .app-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--brass-light);
  }
  .app-sub {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--parch-dark);
    text-transform: uppercase;
  }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--ink-mid);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.7rem 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
  }
  .status-item { display: flex; flex-direction: column; gap: 0.1rem; }
  .status-label { color: var(--parch-dark); font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; }
  .status-value { color: var(--parch); font-weight: 600; }
  .status-value.cav { color: var(--cav-glow); }

  /* ── CARDS ── */
  .card {
    background: var(--ink-mid);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .card-head {
    background: var(--ink-soft);
    padding: 0.65rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass-light);
  }
  .card-head .glyph { color: var(--brass); opacity: 0.7; font-size: 0.9rem; }
  .card-body { padding: 1rem; }

  /* ── FORM ELEMENTS ── */
  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--parch-dark);
    margin-bottom: 0.4rem;
    margin-top: 0.9rem;
  }
  label:first-child { margin-top: 0; }

  textarea, input[type="text"], input[type="password"], select {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.75rem 0.9rem;
    color: var(--parch);
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--brass); }
  textarea::placeholder, input::placeholder { color: var(--parch-dark); opacity: 0.4; }
  select { appearance: none; cursor: pointer; }
  select option { background: var(--ink-mid); }

  /* ── TOGGLE ── */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0;
    margin-top: 0.5rem;
  }
  .toggle-label { font-size: 0.9rem; color: var(--parch-mid); }
  .toggle {
    position: relative;
    width: 44px; height: 24px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: var(--parch-dark);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider { background: rgba(184,134,11,0.3); border-color: var(--brass); }
  .toggle input:checked + .slider::before { transform: translateX(20px); background: var(--brass-light); }

  .discount-fields {
    display: none;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
    margin-top: 0.75rem;
  }
  .discount-fields.visible { display: block; }

  /* ── BUTTONS ── */
  .btn {
    width: 100%;
    padding: 0.9rem 1.5rem;
    border: none;
    border-radius: 3px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1rem;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: var(--brass);
    color: var(--ink);
  }
  .btn-primary:hover { background: var(--brass-light); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-send {
    background: linear-gradient(135deg, #1a4a1a, #2d6a2d);
    color: #90d490;
    border: 1px solid rgba(100,200,100,0.3);
    font-size: 1.1rem;
  }
  .btn-send:hover { background: linear-gradient(135deg, #2d6a2d, #3d8a3d); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--parch-dark);
    border: 1px solid var(--border);
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }
  .btn-ghost:hover { border-color: var(--brass); color: var(--brass-light); }

  /* ── PREVIEW PANEL ── */
  #preview-panel {
    display: none;
    animation: slideUp 0.4s ease;
  }
  #preview-panel.visible { display: block; }

  .preview-subject {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--brass-light);
    margin-bottom: 0.25rem;
    line-height: 1.3;
  }
  .preview-preview-text {
    font-size: 0.85rem;
    color: var(--parch-dark);
    font-style: italic;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .preview-body {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--parch-mid);
    white-space: pre-wrap;
    font-family: 'Crimson Pro', serif;
  }

  .edit-field {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.75rem;
    color: var(--parch);
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
    margin-bottom: 0.5rem;
  }
  .edit-field:focus { border-color: var(--brass); }

  /* ── STATUS MESSAGES ── */
  .msg {
    padding: 0.75rem 1rem;
    border-radius: 3px;
    font-size: 0.9rem;
    margin-top: 0.75rem;
    display: none;
  }
  .msg.visible { display: block; }
  .msg-error { background: rgba(200,75,32,0.15); border: 1px solid rgba(200,75,32,0.3); color: #e08060; }
  .msg-success { background: rgba(45,106,45,0.15); border: 1px solid rgba(45,106,45,0.3); color: #90d490; }
  .msg-info { background: rgba(91,168,196,0.1); border: 1px solid rgba(91,168,196,0.2); color: var(--cav-glow); }

  /* ── LOADING ── */
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    vertical-align: middle;
  }
  .loading-dots span {
    width: 5px; height: 5px;
    background: currentColor;
    border-radius: 50%;
    animation: pulse 1.2s ease infinite;
    opacity: 0.4;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.5rem 0;
    color: var(--parch-dark);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── SENT BADGE ── */
  .sent-confirm {
    text-align: center;
    padding: 2rem 1rem;
    display: none;
  }
  .sent-confirm.visible { display: block; }
  .sent-glyph {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  .sent-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--brass-light);
    margin-bottom: 0.5rem;
  }
  .sent-sub { color: var(--parch-dark); font-size: 0.9rem; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* ── ORNAMENT ── */
  .ornament {
    text-align: center;
    color: var(--brass);
    opacity: 0.4;
    font-size: 1rem;
    letter-spacing: 0.3em;
    margin: 0.25rem 0;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<!-- ═══════════════════════ LOCK SCREEN ═══════════════════════ -->
<div id="lock-screen">
  <div>
    <div class="ornament">✦ ✦ ✦</div>
    <h1 class="lock-title">The Ink Room</h1>
    <div class="ornament">✦ ✦ ✦</div>
  </div>
  <p class="lock-sub">J.D. Siler · Author Communications</p>
  <div class="lock-input-wrap">
    <input class="lock-input" type="password" id="secret-input" placeholder="Enter your key" autocomplete="current-password">
    <div class="lock-error" id="lock-error"></div>
    <button class="btn btn-primary" onclick="unlock()" style="margin-top:0;">Enter</button>
  </div>
</div>

<!-- ═══════════════════════ MAIN APP ═══════════════════════════ -->
<div id="app">

  <div class="app-header">
    <div class="ornament" style="opacity:0.6;">✦ ✦ ✦</div>
    <h1 class="app-title">The Ink Room</h1>
    <p class="app-sub">Sky Bridge Saga · Author Mailer</p>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="status-bar">
    <div class="status-item">
      <span class="status-label">Subscribers</span>
      <span class="status-value cav" id="sub-count">—</span>
    </div>
    <div class="status-item" style="text-align:center;">
      <span class="status-label">Last Sent</span>
      <span class="status-value" id="last-sent-date">—</span>
    </div>
    <div class="status-item" style="text-align:right;">
      <span class="status-label">Subject</span>
      <span class="status-value" id="last-subject" style="font-size:0.78rem;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</span>
    </div>
  </div>

  <!-- ── COMPOSE PANEL ── -->
  <div id="compose-panel">

    <div class="card">
      <div class="card-head"><span class="glyph">✍</span><h2>This Month's Letter</h2></div>
      <div class="card-body">

        <label for="update-text">What's on your mind? <span style="font-size:0.85em;text-transform:none;letter-spacing:0;">(two sentences is enough — or leave blank)</span></label>
        <textarea id="update-text" rows="4" placeholder="e.g. Book 2 is taking shape. The dissolving cove scene is written and it's exactly right."></textarea>

        <label for="tone-select">Tone this month</label>
        <select id="tone-select">
          <option value="warm and story-rich">Warm & story-rich</option>
          <option value="quietly exciting — something is building">Something is building</option>
          <option value="reflective and personal — the author behind the work">Reflective & personal</option>
          <option value="worldbuilding deep-dive — immerse the reader in Stella">Worldbuilding deep-dive</option>
          <option value="gentle urgency — now is a good moment to read">Gentle urgency</option>
        </select>

        <div class="toggle-row" style="margin-top:1rem;">
          <span class="toggle-label">Include a discount offer</span>
          <label class="toggle">
            <input type="checkbox" id="discount-toggle" onchange="toggleDiscount()">
            <span class="slider"></span>
          </label>
        </div>

        <div class="discount-fields" id="discount-fields">
          <label for="discount-code">Discount code</label>
          <input type="text" id="discount-code" placeholder="e.g. EMBERS20">
          <label for="discount-note">What it gets them</label>
          <input type="text" id="discount-note" placeholder="e.g. 20% off Embers of Elekra on Folio this month only">
        </div>

        <button class="btn btn-primary" id="generate-btn" onclick="generateEmail()">
          Generate Letter
        </button>

        <div class="msg msg-error" id="generate-error"></div>
        <div class="msg msg-info" id="generate-info"></div>

      </div>
    </div>

    <!-- ── PREVIEW PANEL ── -->
    <div id="preview-panel" class="card">
      <div class="card-head"><span class="glyph">◉</span><h2>Preview & Edit</h2></div>
      <div class="card-body">

        <label>Subject line</label>
        <input type="text" class="edit-field" id="edit-subject" style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;">

        <label>Preview text <span style="font-size:0.85em;text-transform:none;letter-spacing:0;">(shown after subject in inbox)</span></label>
        <input type="text" class="edit-field" id="edit-preview-text">

        <label>Body</label>
        <textarea class="edit-field" id="edit-body" rows="14"></textarea>

        <div class="divider">Looks right?</div>

        <button class="btn btn-send" id="send-btn" onclick="sendEmail()">
          Send to List
        </button>
        <button class="btn btn-ghost" onclick="regenerate()">Generate a different version</button>

        <div class="msg msg-error" id="send-error"></div>
        <div class="msg msg-success" id="send-success"></div>

      </div>
    </div>

    <!-- ── SENT CONFIRMATION ── -->
    <div class="sent-confirm" id="sent-confirm">
      <span class="sent-glyph">✉︎</span>
      <div class="sent-title">Letter sent.</div>
      <p class="sent-sub" id="sent-detail"></p>
      <button class="btn btn-ghost" onclick="resetForm()" style="max-width:200px;margin:1.5rem auto 0;">Write another</button>
    </div>

  </div>

</div>

<script>
  const WORKER = 'https://jdsiler-author-mailer.jacobdsiler.workers.dev';
  let adminSecret = '';
  let currentEmail = null;

  // ── LOCK ──────────────────────────────────────────────────────────────────

  document.getElementById('secret-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlock();
  });

  async function unlock() {
    const input = document.getElementById('secret-input');
    const err = document.getElementById('lock-error');
    const secret = input.value.trim();
    if (!secret) return;

    err.textContent = 'Checking…';
    try {
      const res = await fetch(`${WORKER}/status`, {
        headers: { 'X-Admin-Secret': secret }
      });
      if (res.status === 401) {
        err.textContent = 'That key isn\'t right.';
        input.value = '';
        return;
      }
      const data = await res.json();
      adminSecret = secret;
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      populateStatus(data);
    } catch (e) {
      err.textContent = 'Could not reach the Worker. Check your connection.';
    }
  }

  // ── STATUS ────────────────────────────────────────────────────────────────

  function populateStatus(data) {
    document.getElementById('sub-count').textContent =
      data.subscriberCount != null ? data.subscriberCount.toLocaleString() : '—';
    document.getElementById('last-sent-date').textContent =
      data.lastSentDate ? formatDate(data.lastSentDate) : 'Never';
    document.getElementById('last-subject').textContent =
      data.lastSentSubject || '—';
    document.getElementById('last-subject').title = data.lastSentSubject || '';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ── DISCOUNT TOGGLE ───────────────────────────────────────────────────────

  function toggleDiscount() {
    const on = document.getElementById('discount-toggle').checked;
    document.getElementById('discount-fields').classList.toggle('visible', on);
  }

  // ── GENERATE ──────────────────────────────────────────────────────────────

  async function generateEmail() {
    const btn = document.getElementById('generate-btn');
    const errEl = document.getElementById('generate-error');
    const infoEl = document.getElementById('generate-info');

    errEl.classList.remove('visible');
    infoEl.classList.remove('visible');

    const update = document.getElementById('update-text').value.trim();
    const tone = document.getElementById('tone-select').value;
    const includeDiscount = document.getElementById('discount-toggle').checked;
    const discountCode = document.getElementById('discount-code').value.trim();
    const discountNote = document.getElementById('discount-note').value.trim();

    if (includeDiscount && (!discountCode || !discountNote)) {
      errEl.textContent = 'Please fill in the discount code and description.';
      errEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Writing <span class="loading-dots"><span></span><span></span><span></span></span>';
    infoEl.textContent = 'Gemini is composing your letter — this takes about 10 seconds…';
    infoEl.classList.add('visible');

    try {
      const res = await fetch(`${WORKER}/generate`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': adminSecret,
        },
        body: JSON.stringify({ update, tone, includeDiscount, discountCode, discountNote }),
      });

      const data = await res.json();
      infoEl.classList.remove('visible');

      if (!data.ok) {
        errEl.textContent = data.error || 'Generation failed. Try again.';
        errEl.classList.add('visible');
        return;
      }

      currentEmail = data.email;
      populatePreview(data.email);
      document.getElementById('preview-panel').classList.add('visible');
      document.getElementById('preview-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (e) {
      infoEl.classList.remove('visible');
      errEl.textContent = 'Network error. Check your connection and try again.';
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Letter';
    }
  }

  function populatePreview(email) {
    document.getElementById('edit-subject').value = email.subject || '';
    document.getElementById('edit-preview-text').value = email.previewText || '';
    document.getElementById('edit-body').value = email.bodyText || '';
  }

  async function regenerate() {
    document.getElementById('preview-panel').classList.remove('visible');
    await generateEmail();
  }

  // ── SEND ──────────────────────────────────────────────────────────────────

  async function sendEmail() {
    const btn = document.getElementById('send-btn');
    const errEl = document.getElementById('send-error');
    const successEl = document.getElementById('send-success');

    errEl.classList.remove('visible');
    successEl.classList.remove('visible');

    const subject = document.getElementById('edit-subject').value.trim();
    const previewText = document.getElementById('edit-preview-text').value.trim();
    const bodyText = document.getElementById('edit-body').value.trim();

    if (!subject || !bodyText) {
      errEl.textContent = 'Subject and body are required.';
      errEl.classList.add('visible');
      return;
    }

    // Build simple HTML from the plain text body
    const htmlBody = `<div style="font-family:Georgia,serif;font-size:17px;line-height:1.7;color:#2a2218;max-width:580px;">
${bodyText.split('\n\n').map(p => `<p style="margin:0 0 1.2em 0;">${p.replace(/\n/g,'<br>')}</p>`).join('')}
</div>`;

    const confirmed = confirm(`Send "${subject}" to your entire list now?`);
    if (!confirmed) return;

    btn.disabled = true;
    btn.innerHTML = 'Sending <span class="loading-dots"><span></span><span></span><span></span></span>';

    try {
      const res = await fetch(`${WORKER}/send`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': adminSecret,
        },
        body: JSON.stringify({ subject, previewText, htmlBody, plainBody: bodyText }),
      });

      const data = await res.json();

      if (!data.ok) {
        errEl.textContent = data.error || 'Send failed. Check MailerLite and try again.';
        errEl.classList.add('visible');
        return;
      }

      // Show confirmation
      document.getElementById('preview-panel').classList.remove('visible');
      document.getElementById('compose-panel').querySelector('.card').style.display = 'none';
      const confirm_el = document.getElementById('sent-confirm');
      document.getElementById('sent-detail').textContent =
        `"${subject}" is on its way to your readers.`;
      confirm_el.classList.add('visible');

      // Refresh status
      const statusRes = await fetch(`${WORKER}/status`, {
        headers: { 'X-Admin-Secret': adminSecret }
      });
      populateStatus(await statusRes.json());

    } catch (e) {
      errEl.textContent = 'Network error during send. Check MailerLite dashboard to confirm status.';
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send to List';
    }
  }

  // ── RESET ─────────────────────────────────────────────────────────────────

  function resetForm() {
    document.getElementById('update-text').value = '';
    document.getElementById('tone-select').selectedIndex = 0;
    document.getElementById('discount-toggle').checked = false;
    document.getElementById('discount-fields').classList.remove('visible');
    document.getElementById('discount-code').value = '';
    document.getElementById('discount-note').value = '';
    document.getElementById('preview-panel').classList.remove('visible');
    document.getElementById('sent-confirm').classList.remove('visible');
    document.getElementById('compose-panel').querySelector('.card').style.display = '';
    document.getElementById('generate-error').classList.remove('visible');
    document.getElementById('generate-info').classList.remove('visible');
    currentEmail = null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
